# Деплой сайта на GitHub Pages: статический лендинг (index.html, img/, robots.txt,
# sitemap.xml) в корне + блог на Hugo (исходники в blog-src/), собранный в /blog.
#
# Settings → Pages → Source: "GitHub Actions" (уже переключено).
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Build blog with Hugo
        working-directory: blog-src
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify --baseURL "https://alekseevtrener.ru/blog/"

      - name: Assemble site
        run: |
          mkdir -p _site
          # Корень: лендинг — всё, кроме служебных папок/файлов репозитория
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='blog-src' \
            --exclude='_site' \
            ./ _site/
          # Блог — собранный Hugo-сайт в подпапку /blog
          mkdir -p _site/blog
          rsync -a blog-src/public/ _site/blog/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
